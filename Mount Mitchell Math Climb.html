<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mount Mitchell Math Climb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: trail-sign header over a two-column board — question card on the left, the mountain trail on the right; stacks on phones */
:root{
  --bg:#e9efed; --surface:#ffffff; --surface2:#f4f7f6; --ink:#1c2830; --muted:#566871; --line:#cdd8d5;
  --sky:#d6e5ec; --ridge1:#a3bccb; --ridge2:#5f8299; --ridge3:#3d5d74;
  --sign:#5a3a1f; --signink:#f5e6c6; --accent:#c93e70; --accentink:#ffffff;
  --good:#24764a; --goodbg:#dff1e5; --bad:#ae3129; --badbg:#f8e1df;
  --teamA:#c93e70; --teamB:#1f6fa5;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11191e; --surface:#1a252c; --surface2:#212e36; --ink:#e7eef0; --muted:#9db0b8; --line:#2d3d46;
  --sky:#162631; --ridge1:#2c4757; --ridge2:#223a48; --ridge3:#1a3040;
  --sign:#6a4526; --signink:#f5e6c6; --accent:#ec6d9b; --accentink:#1a0d12;
  --good:#63c98b; --goodbg:#16301f; --bad:#f2817a; --badbg:#3a1c1a;
  --teamA:#ec6d9b; --teamB:#5ab0e6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11191e; --surface:#1a252c; --surface2:#212e36; --ink:#e7eef0; --muted:#9db0b8; --line:#2d3d46;
  --sky:#162631; --ridge1:#2c4757; --ridge2:#223a48; --ridge3:#1a3040;
  --sign:#6a4526; --signink:#f5e6c6; --accent:#ec6d9b; --accentink:#1a0d12;
  --good:#63c98b; --goodbg:#16301f; --bad:#f2817a; --badbg:#3a1c1a;
  --teamA:#ec6d9b; --teamB:#5ab0e6; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:20px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* trail sign header */
.sign{background:var(--sign);color:var(--signink);border-radius:10px;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;
  box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--signink) 35%,transparent),inset 0 0 0 6px var(--sign),inset 0 0 0 7px color-mix(in srgb,var(--signink) 25%,transparent)}
.sign h1{font-family:var(--display);font-weight:400;font-size:clamp(1.25rem,3.6vw,2rem);line-height:1.1;margin:0;letter-spacing:.02em;text-wrap:balance}
.sign .elev{font-family:var(--display);font-size:.85rem;letter-spacing:.08em;opacity:.9}

.board{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

/* setup */
.group{display:grid;gap:10px;margin-bottom:22px}
.group h2{font-size:1.05rem;margin:0;font-weight:600}
.seg,.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg .opt{border-radius:10px;padding:10px 18px}
.grade-opt{font-family:var(--display);font-weight:400;font-size:1.1rem}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.teams{grid-template-columns:1fr}}
.teams label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.teams input{border:2px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;min-width:0}
.go{background:var(--accent);color:var(--accentink);border:0;border-radius:12px;padding:14px 26px;font-weight:700;font-size:1.05rem;cursor:pointer}
.go:hover{filter:brightness(1.07)}
.ghost{background:transparent;border:2px solid var(--line);border-radius:12px;padding:12px 20px;font-weight:600;cursor:pointer}
.hintline{font-size:.85rem;color:var(--muted);margin:0}

/* play */
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.turn{color:#fff}
.prompt{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:600;text-align:center;padding:26px 8px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.3em;line-height:1.2}
.prompt.word{font-size:1.15rem;font-weight:500;text-align:left;justify-content:flex-start;display:block;line-height:1.7;padding:18px 4px}
.prompt.word .frac{font-size:.85em}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.answers{grid-template-columns:1fr}}
.ans{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;min-height:72px;font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.ans:hover:not(:disabled){border-color:var(--ink)}
.ans .key{flex:none;font-family:var(--display);font-size:.9rem;font-weight:400;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}
.ans:disabled{cursor:default}
.ans.right{background:var(--goodbg);border-color:var(--good)}
.ans.right .key{background:var(--good);color:var(--surface)}
.ans.wrong{background:var(--badbg);border-color:var(--bad)}
.ans.wrong .key{background:var(--bad);color:var(--surface)}
.ans.dim{opacity:.5}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.78em;line-height:1.05;margin:0 .06em}
.frac>span{padding:0 .18em}
.frac>span:first-child{border-bottom:.09em solid currentColor}
.mixed{display:inline-flex;align-items:center;gap:.12em}
.ans small{font-size:.65em;color:var(--muted);font-weight:600}
.feedback{margin-top:16px;border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.feedback.good{background:var(--goodbg);border-left:6px solid var(--good)}
.feedback.bad{background:var(--badbg);border-left:6px solid var(--bad)}
.feedback strong{font-size:1.1rem}
.feedback p{margin:0;max-width:65ch}
.feedback .row{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:4px}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}

/* mountain */
.mtn{width:100%;height:auto;display:block;border-radius:10px}
.stats{display:grid;gap:10px;margin-top:14px}
.climber{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.climber .who{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.climber .ft{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.climber .sub{font-size:.8rem;color:var(--muted);font-weight:500}
.hiker{transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
@media (prefers-reduced-motion:reduce){.hiker,.progress i{transition:none}}

/* results */
.big{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.6rem);line-height:1;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.review{display:grid;gap:10px;margin:18px 0;padding:0;list-style:none}
.review li{background:var(--surface2);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.review .rq{font-weight:600}
.review .ra{font-size:.95rem;color:var(--muted)}
.review .ra b{color:var(--good)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.kbd{font-size:.8rem;color:var(--muted);margin:14px 0 0}
</style>

<div class="wrap">
  <header class="sign">
    <h1>Mt. Mitchell Math Climb</h1>
    <span class="elev">Summit Elev. 6,684 ft</span>
  </header>

  <div class="board">
    <main class="card" id="panel"></main>
    <aside class="card" aria-label="Trail progress">
      <p class="eyebrow">Trail to the summit</p>
      <svg class="mtn" viewBox="0 0 320 210" role="img" aria-label="Mountain trail showing each climber's progress">
        <rect width="320" height="210" fill="var(--sky)"/>
        <path d="M0 150 L48 112 L92 132 L140 88 L186 120 L250 92 L320 128 L320 210 L0 210Z" fill="var(--ridge1)"/>
        <path d="M0 210 L0 175 L70 140 L130 95 L180 60 L232 24 L270 58 L320 100 L320 210Z" fill="var(--ridge3)"/>
        <path id="trail" d="M30 192 L140 182 L90 165 L180 148 L150 125 L215 108 L190 88 L240 72 L215 52 L232 30" fill="none" stroke="var(--signink)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" opacity=".85"/>
        <path d="M0 210 L0 200 L60 193 L120 204 L200 197 L260 206 L320 199 L320 210Z" fill="var(--ridge2)"/>
        <line x1="232" y1="24" x2="232" y2="6" stroke="var(--signink)" stroke-width="2"/>
        <path d="M232 6 L248 10.5 L232 15Z" fill="var(--accent)"/>
        <text x="252" y="22" font-family="Lexend, sans-serif" font-size="10" font-weight="600" fill="var(--ink)">6,684 ft</text>
        <text x="8" y="16" font-family="Lexend, sans-serif" font-size="9" fill="var(--muted)">Black Mountains, NC</text>
        <g id="hikers"></g>
      </svg>
      <div class="stats" id="stats"></div>
    </aside>
  </div>
</div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const r6=x=>Math.round(x*1e6)/1e6;
const fmt=x=>r6(x).toLocaleString('en-US',{maximumFractionDigits:4});
const NAMES=['Maya','Jamal','Sofia','Liam','Priya','Diego','Ava','Marcus','Keisha','Noah','Mei','Elijah'];
const SUMMIT=6684;

function simp(n,d){const g=gcd(n,d)||1;return [n/g,d/g]}
const fr0=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const mx=(w,n,d)=>!n?`<span class="num">${w}</span>`:(w?`<span class="mixed"><span class="num">${w}</span>${fr0(n,d)}</span>`:fr0(n,d));
function fh(n,d){const [a,b]=simp(n,d);if(b===1)return `<span class="num">${a}</span>`;const w=Math.floor(a/b);return mx(w,a%b,b)}
function ft(n,d){const [a,b]=simp(n,d);if(b===1)return `${a}`;const w=Math.floor(a/b),r=a%b;return w?`${w} ${r}/${b}`:`${a}/${b}`}
const mt=(w,n,d)=>!n?`${w}`:(w?`${w} ${n}/${d}`:`${n}/${d}`);

const A={
  num:x=>({k:'n'+r6(x),v:r6(x),h:`<span class="num">${fmt(x)}</span>`}),
  money:x=>({k:'n'+r6(x),v:r6(x),h:`<span class="num">$${x.toFixed(2)}</span>`}),
  fr:(n,d)=>({k:'n'+r6(n/d),v:r6(n/d),h:fh(n,d)}),
  rem:(q,r)=>({k:'r'+q+'_'+r,v:q,h:`<span class="num">${fmt(q)}${r?` <small>R</small> ${r}`:''}</span>`})
};
function Q(o){
  const out=[o.ans],seen=new Set([o.ans.k]);
  for(const c of o.c||[]){if(out.length>=4)break;if(!c||!(c.v>0)||!isFinite(c.v)||seen.has(c.k))continue;seen.add(c.k);out.push(c)}
  let t=0;while(out.length<4&&t<80){t++;const c=o.j();if(c&&c.v>0&&!seen.has(c.k)){seen.add(c.k);out.push(c)}}
  return {topic:o.t,p:o.p,word:!!o.w,ans:o.ans,opts:shuffle(out),ex:o.ex};
}
function noCarry(a,b){const s=String(a),u=String(b).padStart(s.length,'0');let r='';for(let i=0;i<s.length;i++)r+=(+s[i]+ +u[i])%10;return +r}
function noBorrow(a,b){const s=String(a),u=String(b).padStart(s.length,'0');let r='';for(let i=0;i<s.length;i++)r+=Math.abs(+s[i]-+u[i]);return +r}
const jit=(x,steps)=>()=>A.num(x+pick([-1,1])*pick(steps));

/* ---------- Grade 5 ---------- */
const G5={
 add(){
  if(Math.random()<.3){
    const a=ri(12000,89999),b=ri(1200,9999),s=a+b;
    return Q({t:'Addition',p:`${fmt(a)} + ${fmt(b)}`,ans:A.num(s),c:[A.num(noCarry(a,b)),A.num(s+10),A.num(s-100),A.num(s+1000)],j:jit(s,[10,100,1000]),
      ex:`Line up the place values and add from the ones place. Regroup when a place adds to 10 or more. ${fmt(a)} + ${fmt(b)} = ${fmt(s)}.`});
  }
  const Ai=ri(105,6899),ten=Math.random()<.5,Bi=ten?ri(11,99)*10:ri(101,999),S=(Ai+Bi)/100;
  const c=[ten?A.num((Ai+Bi/10)/100):A.num((Ai*10+Bi)/1000),A.num(S+1),A.num(S-0.1),A.num(S+0.01)];
  const ex=`Line up the decimal points. ${ten?`Write ${fmt(Bi/100)} as ${(Bi/100).toFixed(2)} so both numbers have hundredths. `:''}Add each place from right to left: ${fmt(Ai/100)} + ${fmt(Bi/100)} = ${fmt(S)}.`;
  if(Math.random()<.45){const n=pick(NAMES);
    return Q({t:'Addition',w:1,p:`On the Blue Ridge Parkway, ${n}'s family drove ${fmt(Ai/100)} miles before lunch and ${fmt(Bi/100)} miles after lunch. How many miles did they drive in all?`,ans:A.num(S),c,j:jit(S,[.1,1,.01,10]),ex});}
  return Q({t:'Addition',p:`${fmt(Ai/100)} + ${fmt(Bi/100)}`,ans:A.num(S),c,j:jit(S,[.1,1,.01,10]),ex});
 },
 sub(){
  if(Math.random()<.25){
    const a=ri(20000,89999),b=ri(1200,a-1000),d=a-b;
    return Q({t:'Subtraction',p:`${fmt(a)} − ${fmt(b)}`,ans:A.num(d),c:[A.num(noBorrow(a,b)),A.num(d+10),A.num(d-100),A.num(d+1000)],j:jit(d,[10,100,1000]),
      ex:`Line up the place values and subtract from the ones place. When the top digit is smaller, regroup from the next place. Check: ${fmt(d)} + ${fmt(b)} = ${fmt(a)}.`});
  }
  const Ai=ri(800,9999),ten=Math.random()<.5,Bi=ten?ri(11,Math.floor((Ai-60)/10))*10:ri(101,Ai-60),D=(Ai-Bi)/100;
  const c=[A.num(noBorrow(Ai,Bi)/100),A.num(D+1),A.num(D-0.1),A.num(D+0.1)];
  const ex=`Line up the decimal points and subtract each place, regrouping when needed. Check by adding: ${fmt(D)} + ${fmt(Bi/100)} = ${fmt(Ai/100)}.`;
  if(Math.random()<.45){const n=pick(NAMES),m=x=>A.money(x);
    return Q({t:'Subtraction',w:1,p:`${n} brought $${(Ai/100).toFixed(2)} to the NC State Fair and spent $${(Bi/100).toFixed(2)} on rides. How much money does ${n} have left?`,
      ans:m(D),c:[m(noBorrow(Ai,Bi)/100),m(D+1),m(D-0.1),m(D+0.1)],j:()=>m(D+pick([-1,1])*pick([.1,1,.01,10])),ex});}
  return Q({t:'Subtraction',p:`${fmt(Ai/100)} − ${fmt(Bi/100)}`,ans:A.num(D),c,j:jit(D,[.1,1,.01,10]),ex});
 },
 mul(){
  const r=Math.random();
  if(r<.5){
    const a=ri(112,989),b=ri(12,89),t=Math.floor(b/10),o=b%10,P=a*b;
    const ex=`Use partial products. ${fmt(a)} × ${o} = ${fmt(a*o)} and ${fmt(a)} × ${t*10} = ${fmt(a*t*10)}. Add them: ${fmt(a*o)} + ${fmt(a*t*10)} = ${fmt(P)}. Remember the zero in the tens row.`;
    if(Math.random()<.35){const n=pick(NAMES);
      return Q({t:'Multiplication',w:1,p:`A school in Asheville orders ${b} boxes of pencils. Each box has ${a} pencils. How many pencils is that?`,ans:A.num(P),c:[A.num(a*t+a*o),A.num(P+a),A.num(P-a),A.num(P+100)],j:jit(P,[10,100,a]),ex});}
    return Q({t:'Multiplication',p:`${fmt(a)} × ${b}`,ans:A.num(P),c:[A.num(a*t+a*o),A.num(P+a),A.num(P-a),A.num(P+100)],j:jit(P,[10,100,a]),ex});
  }
  if(r<.75){
    const a=ri(12,99)/10,b=ri(3,9),P=r6(a*b);
    return Q({t:'Multiplication',p:`${fmt(a)} × ${b}`,ans:A.num(P),c:[A.num(P*10),A.num(P/10),A.num(P+b)],j:jit(P,[1,.1,b]),
      ex:`Multiply ${a*10} × ${b} = ${fmt(a*10*b)}. ${fmt(a)} has one decimal place, so the product has one decimal place: ${fmt(P)}.`});
  }
  const a=ri(2,9),b=ri(12,89),P=a*b/100;
  return Q({t:'Multiplication',p:`${fmt(a/10)} × ${fmt(b/10)}`,ans:A.num(P),c:[A.num(P*10),A.num(P/10),A.num(P+0.1)],j:jit(P,[.01,.1,1]),
    ex:`Multiply ${a} × ${b} = ${a*b}. Each factor has one decimal place (tenths), so the product has two: ${fmt(P)}. Estimate to check: ${fmt(a/10)} is less than 1, so the answer is less than ${fmt(b/10)}.`});
 },
 div(){
  if(Math.random()<.6){
    const d=ri(12,49),qMin=Math.ceil(1000/d),qMax=Math.floor((9999-d)/d),q=ri(qMin,qMax),r=Math.random()<.8?ri(1,d-1):0,N=d*q+r;
    return Q({t:'Division',p:`${fmt(N)} ÷ ${d}`,ans:A.rem(q,r),c:[A.rem(q-1,r+d),A.rem(q+1,r),A.rem(q,(r+1)%d),A.rem(q+10,r)],j:()=>A.rem(q+pick([-2,2,-10,10]),ri(0,d-1)),
      ex:`${d} × ${fmt(q)} = ${fmt(d*q)}${r?`, and ${fmt(N)} − ${fmt(d*q)} = ${r} left over`:', with nothing left over'}. Check: ${fmt(q)} × ${d}${r?` + ${r}`:''} = ${fmt(N)}. The remainder must be less than ${d}.`});
  }
  const d=ri(3,9),q=ri(12,99)/10,N=r6(q*d);
  return Q({t:'Division',p:`${fmt(N)} ÷ ${d}`,ans:A.num(q),c:[A.num(q*10),A.num(q/10),A.num(q+1)],j:jit(q,[.1,1,.2]),
    ex:`Divide as if they were whole numbers: ${fmt(N*10)} ÷ ${d} = ${fmt(q*10)}. Place the decimal point in the quotient right above the one in the dividend: ${fmt(q)}. Check: ${fmt(q)} × ${d} = ${fmt(N)}.`});
 },
 frac(){
  const k=Math.random();
  if(k<.4){ // add/sub related denominators
    const fam=pick([[2,4,8],[3,6,12],[5,10]]);let d1=pick(fam),d2=pick(fam.filter(x=>x!==d1));
    let w1=Math.random()<.5?ri(1,4):0,w2=Math.random()<.5&&w1?ri(0,2):0,n1=ri(1,d1-1),n2=ri(1,d2-1);
    const L=lcm(d1,d2);let v1=(w1*d1+n1)*(L/d1),v2=(w2*d2+n2)*(L/d2);
    let op=Math.random()<.5?'+':'−';
    if(op==='−'&&v1<=v2){[d1,d2]=[d2,d1];[w1,w2]=[w2,w1];[n1,n2]=[n2,n1];[v1,v2]=[v2,v1];}
    if(op==='−'&&v1===v2)op='+';
    const N=op==='+'?v1+v2:v1-v2;
    const wrong=op==='+'?A.fr((w1+w2)*(d1+d2)+n1+n2,d1+d2):null;

};

/* ---------- Grade 6 ---------- */
const G6={
 add(){
  const Ai=ri(10000,99999),t=pick(['t','h','th']),Bi=t==='t'?ri(11,99)*100:t==='h'?ri(101,999)*10:ri(1001,9999),S=(Ai+Bi)/1000;

 },
 sub(){
  const Ai=Math.random()<.5?ri(20,99)*1000:ri(20000,99999),Bi=ri(1001,Ai-1000),D=(Ai-Bi)/1000;

    return Q({t:'Subtraction',w:1,p:`A Charlotte runner's goal is ${fmt(Ai/1000)} km this week. ${n} has run ${fmt(Bi/1000)} km so far. How many more km are needed?`,ans:A.num(D),c,j:jit(D,[.1,1,.001,.01]),ex});}

 mul(){
  if(Math.random()<.35){
    const price=ri(150,899)*2/100,yd=ri(1,6)+.5,P=r6(price*yd),n=pick(NAMES),m=A.money;
    return Q({t:'Multiplication',w:1,p:`Fabric at a Greensboro shop costs $${price.toFixed(2)} per yard. ${n} buys ${fmt(yd)} yards. What is the cost?`,ans:m(P),c:[m(P*10),m(P/10),m(price*Math.floor(yd)),m(P+1)],j:()=>m(P+pick([-1,1])*pick([.5,1,2])),
      ex:`Multiply ${fmt(price*100)} × ${fmt(yd*10)} = ${fmt(price*100*yd*10)}. There are three decimal places in the factors, so the product is ${fmt(P)}, or $${P.toFixed(2)}.`});
  }

  return Q({t:'Multiplication',p:`${fmt(a/Math.pow(10,ad))} × ${fmt(b/10)}`,ans:A.num(P),c:[A.num(P*10),A.num(P/10),A.num(P+1)],j:jit(P,[.1,1,.01]),
    ex:`Multiply as whole numbers: ${a} × ${b} = ${fmt(a*b)}. Count decimal places in the factors (${ad} + 1 = ${ad+1}) and place the decimal point: ${fmt(P)}.`});
 },
 div(){
  const r=Math.random();
  if(r<.4){
    const d=ri(13,99),q=ri(Math.ceil(1000/d),Math.floor((99999-d)/d)),rr=Math.random()<.8?ri(1,d-1):0,N=d*q+rr;
    return Q({t:'Division',p:`${fmt(N)} ÷ ${d}`,ans:A.rem(q,rr),c:[A.rem(q-1,rr+d),A.rem(q+1,rr),A.rem(q,(rr+1)%d),A.rem(q+10,rr)],j:()=>A.rem(q+pick([-2,2,-10,10]),ri(0,d-1)),
      ex:`Use long division: divide, multiply, subtract, bring down. ${d} × ${fmt(q)} = ${fmt(d*q)}${rr?`, leaving ${rr}`:''}. Check: ${fmt(q)} × ${d}${rr?` + ${rr}`:''} = ${fmt(N)}.`});
  }

    const d=ri(12,48),q=ri(Math.ceil(1000/d),Math.floor(9000/d)),rr=ri(1,d-1),N=d*q+rr,kind=pick(['need','full','left']);
    const ask={need:`How many boxes are needed to pack all of the biscuits?`,full:`How many boxes can be completely filled?`,left:`How many biscuits are left over after filling as many boxes as possible?`}[kind];

const GEN={5:G5,6:G6};
const TOPICS=[['add','Addition'],['sub','Subtraction'],['mul','Multiplication'],['div','Division'],['frac','Fractions']];

/* ---------- state ---------- */
const S={screen:'setup',grade:5,topics:new Set(['add','sub','mul','div','frac']),mode:'solo',len:10,teams:['Team Pisgah','Team Nantahala'],
  i:0,q:null,answered:false,correct:[0,0],asked:[0,0],streak:[0,0],best:[0,0],missed:[]};

function teamOf(i){return S.mode==='teams'?i%2:0}
function perTeam(){return S.mode==='teams'?S.len/2:S.len}
function elev(t){return Math.round(S.correct[t]/perTeam()*SUMMIT)}

/* ---------- mountain ---------- */
function drawHikers(){
  const path=document.getElementById('trail'),L=path.getTotalLength(),g=document.getElementById('hikers');
  const n=S.mode==='teams'?2:1,cols=['var(--teamA)','var(--teamB)'];
  if(g.children.length!==n){g.innerHTML='';for(let t=0;t<n;t++){g.insertAdjacentHTML('beforeend',`<g class="hiker" data-t="${t}"><circle r="7" fill="${cols[t]}" stroke="var(--surface)" stroke-width="2.5"/></g>`)}}
  for(let t=0;t<n;t++){
    const f=Math.min(1,S.correct[t]/perTeam()),p=path.getPointAtLength(f*L),off=n===2?(t?6:-6):0;
    g.children[t].setAttribute('style',`transform:translate(${p.x+off}px,${p.y}px)`);
  }
  const names=S.mode==='teams'?S.teams:['Your climb'];
  $('#stats').innerHTML=names.map((nm,t)=>`<div class="climber"><span class="who"><span class="dot" style="background:${cols[t]}"></span><span>${esc(nm)}<br><span class="sub">${S.correct[t]} of ${S.asked[t]} correct${S.streak[t]>=2?` · streak ${S.streak[t]}`:''}</span></span></span><span class="ft">${elev(t).toLocaleString('en-US')} ft</span></div>`).join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- screens ---------- */
function renderSetup(){
  $('#panel').innerHTML=`
  <p class="eyebrow">Set up your climb</p>
  <div class="group"><h2>Grade</h2><div class="seg" role="group" aria-label="Grade">
    ${[5,6].map(g=>`<button class="opt grade-opt" id="g${g}" aria-pressed="${S.grade===g}" data-grade="${g}">${g}th Grade</button>`).join('')}</div></div>
  <div class="group"><h2>Skills to practice</h2><div class="chips" role="group" aria-label="Skills">
    ${TOPICS.map(([k,l])=>`<button class="opt" id="t-${k}" aria-pressed="${S.topics.has(k)}" data-topic="${k}">${l}</button>`).join('')}</div>
    <p class="hintline">Pick one skill or several. Questions mix the skills you choose.</p></div>
  <div class="group"><h2>How are you playing?</h2><div class="seg" role="group" aria-label="Mode">
    <button class="opt" id="m-solo" aria-pressed="${S.mode==='solo'}" data-mode="solo">Solo</button>
    <button class="opt" id="m-teams" aria-pressed="${S.mode==='teams'}" data-mode="teams">Two teams</button></div>
    ${S.mode==='teams'?`<div class="teams"><label for="ta">Team 1 name<input id="ta" value="${esc(S.teams[0])}" maxlength="24"></label><label for="tb">Team 2 name<input id="tb" value="${esc(S.teams[1])}" maxlength="24"></label></div><p class="hintline">Teams take turns. Great for a projector or smartboard.</p>`:''}</div>
  <div class="group"><h2>Number of questions</h2><div class="seg" role="group" aria-label="Length">
    ${[10,20,30].map(n=>`<button class="opt" id="l${n}" aria-pressed="${S.len===n}" data-len="${n}">${n}</button>`).join('')}</div></div>
  <button class="go" id="start">Start the climb</button>`;
  $('#panel').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.grade){S.grade=+b.dataset.grade;renderSetup()}
    else if(b.dataset.topic){const k=b.dataset.topic;if(S.topics.has(k)){if(S.topics.size>1)S.topics.delete(k)}else S.topics.add(k);renderSetup()}
    else if(b.dataset.mode){keepNames();S.mode=b.dataset.mode;reset();renderSetup()}
    else if(b.dataset.len){S.len=+b.dataset.len;renderSetup()}
    else if(b.id==='start'){keepNames();reset();S.screen='play';nextQ()}
  };
  drawHikers();
}
function keepNames(){const a=$('#ta'),b=$('#tb');if(a)S.teams[0]=a.value.trim()||'Team 1';if(b)S.teams[1]=b.value.trim()||'Team 2'}
function reset(){S.i=0;S.correct=[0,0];S.asked=[0,0];S.streak=[0,0];S.best=[0,0];S.missed=[];drawHikers()}

function nextQ(){
  if(S.i>=S.len){renderResults();return}
  const k=pick([...S.topics]);let q;
  for(let t=0;t<5;t++){try{q=GEN[S.grade][k]();if(q&&q.opts.length===4)break}catch(e){q=null}}
  S.q=q;S.answered=false;renderPlay();
}
function renderPlay(){
  const q=S.q,t=teamOf(S.i),cols=['var(--teamA)','var(--teamB)'];
  $('#panel').innerHTML=`
  <div class="progress" aria-hidden="true"><i style="width:${S.i/S.len*100}%"></i></div>
  <div class="qhead">
    <span class="pill">Question ${S.i+1} of ${S.len} · ${q.topic}</span>
    ${S.mode==='teams'?`<span class="pill turn" style="background:${cols[t]};border-color:${cols[t]}">${esc(S.teams[t])}'s turn</span>`:`<span class="pill">Grade ${S.grade}</span>`}
  </div>
  <div class="prompt${q.word?' word':''}" id="prompt">${q.p}${q.word?'':' <span>= ?</span>'}</div>
  <div class="answers" role="group" aria-label="Answer choices">
    ${q.opts.map((o,i)=>`<button class="ans" id="a${i}" data-i="${i}"><span class="key">${'ABCD'[i]}</span><span>${o.h}</span></button>`).join('')}
  </div>
  <div id="fb" aria-live="polite"></div>
  <p class="kbd">Keyboard: press A–D or 1–4 to answer, Enter for the next question.</p>`;
  $('#panel').onclick=e=>{const b=e.target.closest('.ans');if(b&&!S.answered)answer(+b.dataset.i);if(e.target.id==='next')advance();if(e.target.id==='quit'){S.screen='setup';renderSetup()}};
  drawHikers();
}
function answer(i){
  const q=S.q,t=teamOf(S.i),ok=q.opts[i].k===q.ans.k;S.answered=true;S.asked[t]++;
  if(ok){S.correct[t]++;S.streak[t]++;S.best[t]=Math.max(S.best[t],S.streak[t])}else{S.streak[t]=0;S.missed.push({p:q.p,ans:q.ans.h,picked:q.opts[i].h,team:t,word:q.word})}
  document.querySelectorAll('.ans').forEach((b,j)=>{b.disabled=true;if(q.opts[j].k===q.ans.k)b.classList.add('right');else if(j===i)b.classList.add('wrong');else b.classList.add('dim')});
  const gain=Math.round(SUMMIT/perTeam());
  const last=S.i+1>=S.len;
  $('#fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}">
    <strong>${ok?`Correct! Up ${gain.toLocaleString('en-US')} ft.${S.streak[t]>=3?` ${S.streak[t]} in a row!`:''}`:'Not quite. The correct answer is highlighted.'}</strong>
    <p>${q.ex}</p>
    <div class="row"><button class="ghost" id="quit">End game</button><button class="go" id="next">${last?'See results':'Next question'}</button></div></div>`;
  drawHikers();$('#next').focus();
}
function advance(){S.i++;nextQ()}

function renderResults(){
  const teams=S.mode==='teams';let head,big;
  if(teams){const [a,b]=[elev(0),elev(1)];head=a===b?'It\'s a tie on the mountain!':`${esc(S.teams[a>b?0:1])} climbs higher!`;big=`${Math.max(a,b).toLocaleString('en-US')} ft`}
  else{const e=elev(0);head=e>=SUMMIT?'You reached the summit!':e>=SUMMIT*.7?'Almost to the top!':e>=SUMMIT*.4?'Halfway up the mountain':'Keep climbing!';big=`${e.toLocaleString('en-US')} ft`}
  const cols=['var(--teamA)','var(--teamB)'];
  $('#panel').innerHTML=`
  <p class="eyebrow">Climb complete · Grade ${S.grade}</p>
  <h2 style="margin:0;font-size:1.4rem">${head}</h2>
  <div class="big">${big}</div>
  <p style="margin:0;color:var(--muted)">${teams?S.teams.map((n,t)=>`${esc(n)}: ${S.correct[t]}/${S.asked[t]} correct, best streak ${S.best[t]}`).join(' · '):`${S.correct[0]} of ${S.len} correct · best streak ${S.best[0]}`}</p>
  ${S.missed.length?`<h3 style="margin:22px 0 0;font-size:1rem">Review the ones you missed</h3><ul class="review">${S.missed.map(m=>`<li>${teams?`<span class="pill" style="justify-self:start;color:#fff;background:${cols[m.team]};border-color:${cols[m.team]}">${esc(S.teams[m.team])}</span>`:''}<span class="rq">${m.p}</span><span class="ra">Answer: <b>${m.ans}</b> · You chose ${m.picked}</span></li>`).join('')}</ul>`:'<p style="margin:18px 0">No misses. Perfect climb!</p>'}
  <div class="btnrow" style="margin-top:16px"><button class="go" id="again">Climb again</button><button class="ghost" id="settings">Change settings</button></div>`;
  $('#panel').onclick=e=>{if(e.target.id==='again'){reset();S.screen='play';nextQ()}if(e.target.id==='settings'){reset();S.screen='setup';renderSetup()}};
  drawHikers();$('#again').focus();
}

document.addEventListener('keydown',e=>{
  if(S.screen!=='play'||e.target.tagName==='INPUT')return;
  const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
  if(m!==undefined&&!S.answered&&$('.ans')){answer(m)}
  else if(e.key==='Enter'&&S.answered&&$('#next')&&document.activeElement!==$('#next')){e.preventDefault();advance()}
});

renderSetup();
</script>

</body></html>
